          wurde später christlich überformt.
        en: >-
          Rome knew an old, plain cult of Sol, which under the emperor Aurelian in AD 274
          rose as Sol Invictus to become an imperial cult. Its feast day on 25 December was
          later overlaid by Christian usage.
