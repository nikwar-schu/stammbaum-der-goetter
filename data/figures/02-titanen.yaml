# yaml-language-server: $schema=../../schema/figures.schema.json
#
# Titanen und ihre Kinder.
#
# Zur Generationsebene: sie muss der Leitversion folgen, ein Kind steht immer
# unter beiden Eltern. Deshalb sitzen Atlas und Prometheus eine Reihe tiefer als
# Zeus - ihre Mutter Klymene ist eine Okeanide und damit selbst schon
# Titanenkind. Das ist kein Fehler, sondern die Abstammung, wie Hesiod sie gibt.

figures:
  # --- Die zwoelf Titanen: Kinder von Gaia und Uranos ---

  - id: okeanos
    category: titan
    tier: 3
    confidence: attested
    parentage:
      - id: hesiod
        parents: [gaia, uranos]
        mode: sexual
        canonical: true
        confidence: attested
        sources:
          - { source: hesiod-theogonie, loc: '133-138' }
    greek:
      name: Okeanos
      nameOriginal: Ὠκεανός
      domains: [ocean-stream, fresh-water, rivers]
      symbols:
        de: [Stierhörner, Krebsscheren]
        en: [bull horns, crab claws]
      description:
        de: >-
          Der Weltstrom, der die Erdscheibe als Ring umfließt, ältester der Titanen.
          Anders als seine Brüder beteiligt er sich nicht am Sturz des Uranos und bleibt
          später auch dem Krieg gegen Zeus fern. Mit Tethys zeugt er dreitausend Flüsse
          und dreitausend Okeaniden.
        en: >-
          The world stream encircling the earth like a ring, eldest of the Titans. Unlike
          his brothers he takes no part in the overthrow of Uranus and later stays out of
          the war against Zeus as well. With Tethys he fathers three thousand rivers and
          three thousand Oceanids.
      sources:
        - { source: hesiod-theogonie, loc: '337-370' }
    roman:
      name: Oceanus
      domains: [ocean-stream, sea]
      description:
        de: >-
          Bei den Römern verschiebt sich Oceanus vom Ringfluss zum Weltmeer jenseits der
          Säulen des Herakles - eine geographische statt einer mythischen Größe. Einen
          eigenen Kult besitzt er nicht.
        en: >-
          Among the Romans, Oceanus shifts from encircling river to the ocean beyond the
          Pillars of Hercules - a geographical rather than a mythical entity. He has no
          cult of his own.
    refs:
      wikipediaDe: https://de.wikipedia.org/wiki/Okeanos
      wikipediaEn: https://en.wikipedia.org/wiki/Oceanus

  - id: tethys
    category: titan
    tier: 3
    confidence: attested
    parentage:
      - id: hesiod
        parents: [gaia, uranos]
        mode: sexual
        canonical: true
        confidence: attested
        sources:
          - { source: hesiod-theogonie, loc: '133-138' }
    greek:
      name: Tethys
      nameOriginal: Τηθύς
      domains: [fresh-water, springs, rivers]
      description:
        de: >-
          Titanin des fließenden Süßwassers und Gemahlin des Okeanos. Bei Homer gilt das
          Paar als Ursprung aller Götter - eine ältere Kosmogonie, die neben Hesiod
          weiterlebt. Sie zog Hera auf, während Zeus gegen Kronos kämpfte.
        en: >-
          Titaness of flowing fresh water and consort of Oceanus. In Homer the pair count
          as the origin of all the gods - an older cosmogony living on beside Hesiod. She
          raised Hera while Zeus fought against Cronus.
      sources:
        - { source: homer-ilias, loc: '14.201-204' }
    roman:
      name: Tethys
      domains: [fresh-water, sea]
      description:
        de: >-
          Die römischen Dichter verwenden den Namen meist bildlich für das Meer selbst.
          Verwechslungen mit der Nereide Thetis, der Mutter des Achill, sind schon antik.
        en: >-
          Roman poets mostly use the name figuratively for the sea itself. Confusion with
          the Nereid Thetis, mother of Achilles, is already ancient.
    refs:
      wikipediaDe: https://de.wikipedia.org/wiki/Tethys_(Mythologie)
      wikipediaEn: https://en.wikipedia.org/wiki/Tethys_(mythology)

  - id: hyperion
    category: titan
    tier: 3
    confidence: attested
    parentage:
      - id: hesiod
        parents: [gaia, uranos]
        mode: sexual
        canonical: true
        confidence: attested
        sources:
          - { source: hesiod-theogonie, loc: '133-138' }
    greek:
      name: Hyperion
      nameOriginal: Ὑπερίων
      domains: [light, sun]
      description:
        de: >-
          Titan des Himmelslichts, dessen Name "der darüber Gehende" bedeutet. Er selbst
          bleibt blass; seine Bedeutung liegt in den Kindern, die er mit Theia zeugt:
          Sonne, Mond und Morgenröte. Homer nennt Helios gelegentlich schlicht Hyperion.
        en: >-
          Titan of celestial light, whose name means "he who goes above". He himself
          remains pale; his significance lies in the children he fathers with Theia: sun,
          moon and dawn. Homer occasionally calls Helios simply Hyperion.
    roman:
      name: Hyperion
      domains: [light, sun]
      description:
        de: >-
          In der lateinischen Dichtung nur als gelehrter Name geführt, meist als
          Umschreibung für die Sonne oder als Vatername des Sol.
        en: >-
          In Latin poetry carried only as a learned name, mostly as a periphrasis for the
          sun or as the patronymic of Sol.
    refs:
      wikipediaDe: https://de.wikipedia.org/wiki/Hyperion_(Mythologie)
      wikipediaEn: https://en.wikipedia.org/wiki/Hyperion_(Titan)

  - id: theia
    category: titan
    tier: 3
    confidence: attested
    parentage:
      - id: hesiod
        parents: [gaia, uranos]
        mode: sexual
        canonical: true
        confidence: attested
        sources:
          - { source: hesiod-theogonie, loc: '133-138' }
    greek:
      name: Theia
      nameOriginal: Θεία
      altNames: [Euryphaessa]
      domains: [light, stars]
      description:
        de: >-
          Titanin des Glanzes, Mutter von Helios, Selene und Eos. Pindar nennt sie die
          Göttin, der die Menschen den Wert des Goldes verdanken - sie verleiht dem Metall
          seinen Schimmer.
        en: >-
          Titaness of radiance, mother of Helios, Selene and Eos. Pindar calls her the
          goddess to whom men owe the worth of gold - she gives the metal its gleam.
      sources:
        - { source: pindar-oden, loc: 'Isthm. 5.1-3' }
    roman:
      name: Thia
      domains: [light, stars]
      description:
        de: >-
          Ohne eigene Bedeutung im römischen Kult; der Name erscheint allein in
          genealogischen Aufzählungen nach griechischem Vorbild.
        en: >-
          Of no significance in Roman cult; the name appears only in genealogical lists
          following Greek models.
    refs:
      wikipediaDe: https://de.wikipedia.org/wiki/Theia
      wikipediaEn: https://en.wikipedia.org/wiki/Theia

  - id: koios
    category: titan
    tier: 3
    confidence: attested
    parentage:
      - id: hesiod
        parents: [gaia, uranos]
        mode: sexual
        canonical: true
        confidence: attested
        sources:
          - { source: hesiod-theogonie, loc: '133-138' }
    greek:
      name: Koios
      nameOriginal: Κοῖος
      domains: [prophecy, sky]
      description:
        de: >-
          Titan, dessen Name mit "fragen" oder "erkunden" zusammenhängt; man deutete ihn
          als Macht des forschenden Verstandes und der himmlischen Achse. Mit seiner
          Schwester Phoibe zeugt er Leto und Asteria - über sie führt die Linie zu
          Apollon, Artemis und Hekate.
        en: >-
          Titan whose name is connected with "to ask" or "to inquire"; he was read as the
          power of searching intellect and of the celestial axis. With his sister Phoebe
          he fathers Leto and Asteria - through them the line leads to Apollo, Artemis and
          Hecate.
    roman:
      name: Coeus
      domains: [prophecy, sky]
      description:
        de: >-
          Reiner Übertragungsname der lateinischen Dichtung, ohne Kult und ohne eigene
          Erzählung.
        en: >-
          A purely transferred name in Latin poetry, without cult and without a story of
          his own.
    refs:
      wikipediaDe: https://de.wikipedia.org/wiki/Koios
      wikipediaEn: https://en.wikipedia.org/wiki/Coeus

  - id: phoibe
    category: titan
    tier: 3
    confidence: attested
    parentage:
      - id: hesiod
        parents: [gaia, uranos]
        mode: sexual
        canonical: true
        confidence: attested
        sources:
          - { source: hesiod-theogonie, loc: '133-138' }
    greek:
      name: Phoibe
      nameOriginal: Φοίβη
      domains: [prophecy, moon]
      description:
        de: >-
          Titanin des reinen Glanzes und, nach Aischylos, dritte Inhaberin des Orakels von
          Delphi: von Gaia über Themis kam es an sie, und sie schenkte es ihrem Enkel
          Apollon zur Geburt. Dessen Beiname Phoibos stammt von ihr.
        en: >-
          Titaness of pure radiance and, according to Aeschylus, third holder of the
          oracle at Delphi: from Gaia by way of Themis it came to her, and she gave it to
          her grandson Apollo at his birth. His epithet Phoebus comes from her.
      sources:
        - { source: aischylos-eumeniden, loc: '1-8' }
    roman:
      name: Phoebe
      domains: [moon, prophecy]
      description:
        de: >-
          Im Lateinischen wird Phoebe fast durchgehend zum Beinamen der Mondgöttin Luna
          oder der Diana - die Titanin selbst tritt hinter dieser Verwendung zurück.
        en: >-
          In Latin, Phoebe becomes almost throughout an epithet of the moon goddess Luna
          or of Diana - the Titaness herself recedes behind this usage.
    refs:
      wikipediaDe: https://de.wikipedia.org/wiki/Phoibe
      wikipediaEn: https://en.wikipedia.org/wiki/Phoebe_(Titaness)

  - id: krios
    category: titan
    tier: 3
    confidence: common
    parentage:
      - id: hesiod
        parents: [gaia, uranos]
        mode: sexual
        canonical: true
        confidence: attested
        sources:
          - { source: hesiod-theogonie, loc: '133-138' }
    greek:
      name: Krios
      nameOriginal: Κρῖος
      domains: [stars, sovereignty]
      description:
        de: >-
          Der am wenigsten fassbare der zwölf Titanen; sein Name bedeutet "Widder", was
          man mit dem Sternbild und dem Jahresbeginn verband. Erzählt wird von ihm nichts -
          er erscheint ausschließlich als Vater von Astraios, Pallas und Perses.
        en: >-
          The least tangible of the twelve Titans; his name means "ram", which was
          connected with the constellation and the start of the year. Nothing is told of
          him - he appears solely as the father of Astraeus, Pallas and Perses.
      sources:
        - { source: hesiod-theogonie, loc: '375-377' }
    roman:
      name: Crius
      domains: [stars]
      description:
        de: >-
          Nur als Name in gelehrten Aufzählungen der Titanen überliefert.
        en: >-
          Transmitted only as a name in learned lists of the Titans.
    refs:
      wikipediaDe: https://de.wikipedia.org/wiki/Kreios
      wikipediaEn: https://en.wikipedia.org/wiki/Crius

  - id: iapetos
    category: titan
    tier: 3
    confidence: attested
    parentage:
      - id: hesiod
        parents: [gaia, uranos]
        mode: sexual
        canonical: true
        confidence: attested
        sources:
          - { source: hesiod-theogonie, loc: '133-138' }
    greek:
      name: Iapetos
      nameOriginal: Ἰαπετός
      domains: [crafts, might]
      description:
        de: >-
          Titan, den die Griechen als Ahnherrn des Menschengeschlechts ansahen - über
          seinen Sohn Prometheus, der die Menschen formt, und dessen Bruder Epimetheus,
          der Pandora annimmt. Seine vier Söhne verkörpern zusammen die Überhebung des
          Sterblichen: Atlas trägt, Menoitios trotzt, Prometheus überlistet, Epimetheus
          begreift zu spät.
        en: >-
          Titan whom the Greeks regarded as forefather of the human race - through his son
          Prometheus, who shapes mankind, and his brother Epimetheus, who accepts Pandora.
          His four sons together embody mortal overreaching: Atlas bears, Menoetius defies,
          Prometheus outwits, Epimetheus understands too late.
      sources:
        - { source: hesiod-theogonie, loc: '507-511' }
    roman:
      name: Iapetus
      domains: [crafts]
      description:
        de: >-
          Im Lateinischen vor allem als Vatername des Prometheus geführt; ein eigenes
          Profil gewinnt er nicht.
        en: >-
          In Latin carried above all as the patronymic of Prometheus; he gains no profile
          of his own.
    refs:
      wikipediaDe: https://de.wikipedia.org/wiki/Iapetos
      wikipediaEn: https://en.wikipedia.org/wiki/Iapetus

  - id: themis
    category: titan
    tier: 3
    confidence: attested
    parentage:
      - id: hesiod
        parents: [gaia, uranos]
        mode: sexual
        canonical: true
        confidence: attested
        sources:
          - { source: hesiod-theogonie, loc: '133-138' }
    greek:
      name: Themis
      nameOriginal: Θέμις
      domains: [order, law, justice, prophecy]
      symbols:
        de: [Waage, Füllhorn]
        en: [scales, cornucopia]
      description:
        de: >-
          Titanin der gesetzten Ordnung - nicht des geschriebenen Rechts, sondern dessen,
          was sich gehört. Sie ist die zweite Gemahlin des Zeus und Mutter der Horen und
          der Moiren; damit sitzt die Ordnung selbst an der Seite des Herrschers. In
          Delphi hütete sie das Orakel vor Phoibe.
        en: >-
          Titaness of established order - not written law, but what is fitting. She is the
          second consort of Zeus and mother of the Horae and the Moirai; thus order itself
          sits at the ruler's side. At Delphi she kept the oracle before Phoebe.
      sources:
        - { source: hesiod-theogonie, loc: '901-906' }
    roman:
      name: Themis
      domains: [order, justice, law]
      description:
        de: >-
          Die Römer kannten Themis als Namen, ordneten ihren Zuständigkeitsbereich aber
          der eigenen Iustitia zu. Bei Ovid ist sie die Orakelgöttin, die Deukalion und
          Pyrrha nach der Sintflut Rat gibt.
        en: >-
          The Romans knew Themis as a name but assigned her sphere to their own Iustitia.
          In Ovid she is the oracular goddess who counsels Deucalion and Pyrrha after the
          flood.
      sources:
        - { source: ovid-metamorphosen, loc: '1.377-394' }
    refs:
      wikipediaDe: https://de.wikipedia.org/wiki/Themis
      wikipediaEn: https://en.wikipedia.org/wiki/Themis

  - id: mnemosyne
    category: titan
    tier: 3
    confidence: attested
    parentage:
      - id: hesiod
        parents: [gaia, uranos]
        mode: sexual
        canonical: true
        confidence: attested
        sources:
          - { source: hesiod-theogonie, loc: '133-138' }
    greek:
      name: Mnemosyne
      nameOriginal: Μνημοσύνη
      domains: [memory, poetry]
      description:
        de: >-
          Die Erinnerung als Göttin. Neun Nächte lag Zeus ihr bei, und sie gebar die neun
          Musen - für eine Kultur ohne Bücher ist das eine folgerichtige Herkunft der
          Dichtung: wer erzählt, erinnert.
        en: >-
          Memory as a goddess. Nine nights Zeus lay with her, and she bore the nine Muses -
          for a culture without books, a consistent origin for poetry: to tell is to
          remember.
      sources:
        - { source: hesiod-theogonie, loc: '53-62' }
        - { source: hesiod-theogonie, loc: '915-917' }
    roman:
      name: Moneta
      domains: [memory, poetry]
      description:
        de: >-
          Die Römer setzten Mnemosyne mit Moneta gleich, dem Beinamen der Iuno, in deren
          Tempel die Münzprägung lag - daher unser Wort "Münze". Als Mutter der Musen ist
          Moneta ein gelehrter Rückgriff, nicht altrömischer Glaube.
        en: >-
          The Romans equated Mnemosyne with Moneta, an epithet of Juno in whose temple the
          mint stood - hence our word "money". As mother of the Muses, Moneta is a learned
          borrowing, not old Roman belief.
    refs:
      wikipediaDe: https://de.wikipedia.org/wiki/Mnemosyne
      wikipediaEn: https://en.wikipedia.org/wiki/Mnemosyne

  - id: kronos
    category: titan
    tier: 3
    confidence: attested
    parentage:
      - id: hesiod
        parents: [gaia, uranos]
        mode: sexual
        canonical: true
        confidence: attested
        sources:
          - { source: hesiod-theogonie, loc: '133-138' }
        note:
          de: Der jüngste der Titanen und der einzige, der sich gegen Uranos zu erheben wagt.
          en: The youngest of the Titans and the only one who dares to rise against Uranus.
    greek:
      name: Kronos
      nameOriginal: Κρόνος
      domains: [harvest, sovereignty, time]
      symbols:
        de: [Sichel]
        en: [sickle]
      description:
        de: >-
          Der jüngste Titan, der seinen Vater Uranos mit der Sichel entmannt und die
          Herrschaft übernimmt. Aus Furcht vor derselben Weissagung verschlingt er seine
          eigenen Kinder, bis Rheia ihm statt Zeus einen Stein reicht. Zeus zwingt ihn,
          die Geschwister wieder auszuspeien, und stürzt ihn.
        en: >-
          The youngest Titan, who castrates his father Uranus with the sickle and takes
          power. Fearing the same prophecy, he swallows his own children until Rhea hands
          him a stone in place of Zeus. Zeus forces him to disgorge the siblings and
          overthrows him.
      sources:
        - { source: hesiod-theogonie, loc: '453-506' }
    roman:
      name: Saturnus
      altNames: [Saturn]
      domains: [agriculture, harvest, wealth]
      symbols:
        de: [Sichel, Winzermesser]
        en: [sickle, pruning hook]
      description:
        de: >-
          Saturn ist keine bloße Übersetzung, sondern ein alter italischer Gott des
          Säens, der erst später mit Kronos verschmolz. Seine Herrschaft galt den Römern
          als goldenes Zeitalter, und sein Fest, die Saturnalien im Dezember, kehrte für
          ein paar Tage alle Ordnung um: Sklaven wurden bedient, Geschenke getauscht.
        en: >-
          Saturn is no mere translation but an old Italic god of sowing, only later merged
          with Cronus. The Romans regarded his reign as a golden age, and his festival, the
          Saturnalia in December, inverted all order for a few days: slaves were waited on,
          gifts exchanged.
      festivals: [Saturnalia]
      cultNotes:
        de: Im Saturntempel am Forum Romanum lag die Staatskasse, das Aerarium.
        en: The state treasury, the aerarium, was kept in the Temple of Saturn on the Forum Romanum.
      sources:
        - { source: ovid-fasti, loc: '1.235-254' }
        - { source: macrobius-saturnalia, loc: '1.7-10' }
    counterparts:
      - figure: chronos-protogonos
        relation: conflated
        note:
          de: Die Gleichsetzung mit Chronos, der Zeit, ist eine antike Volksetymologie und sprachlich nicht haltbar.
          en: The equation with Chronos, Time, is an ancient folk etymology and linguistically untenable.
    refs:
      wikipediaDe: https://de.wikipedia.org/wiki/Kronos
      wikipediaEn: https://en.wikipedia.org/wiki/Cronus

  - id: rheia
    category: titan
    tier: 3
    confidence: attested
    parentage:
      - id: hesiod
        parents: [gaia, uranos]
        mode: sexual
        canonical: true
        confidence: attested
        sources:
          - { source: hesiod-theogonie, loc: '133-138' }
    greek:
      name: Rheia
      nameOriginal: Ῥεία
      altNames: [Rhea]
      domains: [fertility, family, sovereignty]
      description:
        de: >-
          Titanin und Mutter der ersten sechs Olympier. Als Kronos ein Kind nach dem
          anderen verschlingt, bringt sie Zeus heimlich auf Kreta zur Welt und legt dem
          Vater einen gewickelten Stein in den Arm. Ohne diese eine List gäbe es keine
          olympische Ordnung.
        en: >-
          Titaness and mother of the first six Olympians. As Cronus swallows one child
          after another, she secretly bears Zeus on Crete and lays a swaddled stone in the
          father's arms. Without this single ruse there would be no Olympian order.
      sources:
        - { source: hesiod-theogonie, loc: '453-491' }
    roman:
      name: Ops
      altNames: [Opis]
      domains: [fertility, harvest, wealth]
      description:
        de: >-
          Ops ist eine altrömische Göttin des Erntesegens und des Vorrats, Gemahlin des
          Saturn. Ihr Name steckt in "opulent". In der Kaiserzeit verschwimmt sie
          zusätzlich mit der aus Kleinasien übernommenen Magna Mater Cybele.
        en: >-
          Ops is an old Roman goddess of harvest blessing and stores, consort of Saturn.
          Her name survives in "opulent". In the imperial period she additionally blurs
          into the Magna Mater Cybele brought from Asia Minor.
      festivals: [Opiconsivia, Opalia]
      sources:
        - { source: varro-de-lingua-latina, loc: '5.64' }
    refs:
      wikipediaDe: https://de.wikipedia.org/wiki/Rhea_(Mythologie)
      wikipediaEn: https://en.wikipedia.org/wiki/Rhea_(mythology)

  # --- Weitere Kinder von Gaia und Uranos ---

  - id: kyklopen
    category: monster
    tier: 3
    confidence: attested
    parentage:
      - id: hesiod
        parents: [gaia, uranos]
        mode: sexual
        canonical: true
        confidence: attested
        sources:
          - { source: hesiod-theogonie, loc: '139-146' }
    greek:
      name: Kyklopen
      nameOriginal: Κύκλωπες
      altNames: [Brontes, Steropes, Arges]
      domains: [metalworking, thunder, lightning]
      description:
        de: >-
          Drei einäugige Schmiede - Brontes (Donner), Steropes (Blitzschein) und Arges
          (Heller). Uranos hielt sie gefangen; Zeus befreite sie, und zum Dank schmiedeten
          sie ihm den Blitz, Poseidon den Dreizack und Hades die Tarnkappe. Sie sind nicht
          zu verwechseln mit dem menschenfressenden Polyphem der Odyssee.
        en: >-
          Three one-eyed smiths - Brontes (thunder), Steropes (lightning flash) and Arges
          (bright one). Uranus kept them imprisoned; Zeus freed them, and in thanks they
          forged him the thunderbolt, Poseidon the trident and Hades the cap of darkness.
          They are not to be confused with the man-eating Polyphemus of the Odyssey.
      sources:
        - { source: apollodor-bibliotheke, loc: '1.2.1' }
    roman:
      name: Cyclopes
      domains: [metalworking, fire]
      description:
        de: >-
          Bei Vergil arbeiten die Kyklopen in der Werkstatt des Vulcanus unter dem Ätna -
          aus den Urschmieden werden Gesellen eines Gottes.
        en: >-
          In Virgil the Cyclopes work in Vulcan's forge beneath Etna - the primordial
          smiths become a god's journeymen.
      sources:
        - { source: vergil-aeneis, loc: '8.416-453' }
    refs:
      wikipediaDe: https://de.wikipedia.org/wiki/Kyklopen
      wikipediaEn: https://en.wikipedia.org/wiki/Cyclopes

  - id: hekatoncheiren
    category: monster
    tier: 3
    confidence: attested
    parentage:
      - id: hesiod
        parents: [gaia, uranos]
        mode: sexual
        canonical: true
        confidence: attested
        sources:
          - { source: hesiod-theogonie, loc: '147-153' }
    greek:
      name: Hekatoncheiren
      nameOriginal: Ἑκατόγχειρες
      altNames: [Kottos, Briareos, Gyges]
      domains: [might, force]
      description:
        de: >-
          Drei Brüder mit je hundert Armen und fünfzig Köpfen, die stärksten Geschöpfe
          überhaupt. Zeus holt sie aus der Tiefe herauf, und ihr Steinhagel entscheidet
          den zehnjährigen Krieg gegen die Titanen. Danach bewachen sie das Tor des
          Tartaros.
        en: >-
          Three brothers with a hundred arms and fifty heads each, the strongest creatures
          of all. Zeus brings them up from the depths, and their hail of stones decides the
          ten-year war against the Titans. Afterwards they guard the gate of Tartarus.
      sources:
        - { source: hesiod-theogonie, loc: '617-720' }
    roman:
      name: Centimani
      domains: [might, force]
      description:
        de: >-
          Die lateinische Bezeichnung übersetzt den griechischen Namen wörtlich als
          "Hundertarmige"; eigene Erzählungen bilden sich nicht heraus.
        en: >-
          The Latin term translates the Greek name literally as "hundred-handed"; no
          stories of their own develop.
    refs:
